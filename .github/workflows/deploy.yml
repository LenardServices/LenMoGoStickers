# Builds the site and publishes it to GitHub Pages on every push to `main`.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Work out site URL
        env:
          CUSTOM_DOMAIN: ""
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO="${{ github.event.repository.name }}"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            BASE="/"; URL="https://$CUSTOM_DOMAIN/"
          elif [ "$(echo "$REPO" | tr '[:upper:]' '[:lower:]')" = "$OWNER.github.io" ]; then
            BASE="/"; URL="https://$OWNER.github.io/"
          else
            BASE="/$REPO/"; URL="https://$OWNER.github.io/$REPO/"
          fi
          echo "BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=$URL" >> "$GITHUB_ENV"
          echo "Deploying to $URL (base $BASE)"

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
